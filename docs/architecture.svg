<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" font-family="'JetBrains Mono','SF Mono',monospace">
  <rect width="1180" height="800" fill="#0b0e14"/>
  <text x="40" y="44" fill="#e6edf3" font-size="22" font-weight="700">Claude FinOps — Mimari Akışı</text>
  <text x="40" y="68" fill="#6e7681" font-size="13">Tek paylaşılan veri (output/latest.json) · iki bağımsız yol</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="760" y="30" width="14" height="14" rx="3" fill="#0f2a1e" stroke="#3fb950"/><text x="780" y="42" fill="#9fe1cb">Hızlı yol — Python (token yok)</text>
    <rect x="760" y="54" width="14" height="14" rx="3" fill="#2a210d" stroke="#d29922"/><text x="780" y="66" fill="#fac775">AI yol — Claude (token harcar)</text>
  </g>

  <!-- ===== ADIM 1: TARAYICI ===== -->
  <g>
    <rect x="430" y="92" width="320" height="86" rx="10" fill="#10243f" stroke="#388bfd" stroke-width="1.5"/>
    <circle cx="452" cy="116" r="9" fill="#388bfd"/><text x="448" y="120" fill="#fff" font-size="11" font-weight="700">1</text>
    <text x="470" y="120" fill="#e6edf3" font-size="15" font-weight="700">Tarayıcı · Terminal UI</text>
    <text x="448" y="142" fill="#8b949e" font-size="11">index.html + assets/ · tek sayfa</text>
    <text x="448" y="160" fill="#6e7681" font-size="11">net-değer · pozisyon · ⚙ Portföy Düzenle</text>
  </g>

  <!-- arrow UI -> server -->
  <line x1="590" y1="178" x2="590" y2="214" stroke="#388bfd" stroke-width="2" marker-end="url(#b)"/>
  <text x="600" y="200" fill="#8b949e" font-size="11">HTTP · /api/*</text>

  <!-- ===== ADIM 2: SERVER ===== -->
  <g>
    <rect x="150" y="214" width="880" height="92" rx="10" fill="#0d1b2e" stroke="#388bfd" stroke-width="1.5"/>
    <circle cx="172" cy="238" r="9" fill="#388bfd"/><text x="168" y="242" fill="#fff" font-size="11" font-weight="700">2</text>
    <text x="190" y="242" fill="#e6edf3" font-size="15" font-weight="700">pipeline_server.py</text>
    <text x="330" y="242" fill="#6e7681" font-size="11">· yalnızca Python stdlib · 127.0.0.1 · sıfır bağımlılık</text>
    <text x="172" y="272" fill="#9fe1cb" font-size="11">GET  /api/latest · /api/history · /api/search · /api/portfolio</text>
    <text x="172" y="292" fill="#fac775" font-size="11">POST /api/refresh (Python)   ·   POST /api/run (Claude sinyali)   ·   POST /api/portfolio · /api/record-run</text>
  </g>

  <!-- split arrows to two lanes -->
  <path d="M360 306 V330" stroke="#3fb950" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M820 306 V330" stroke="#d29922" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ===== HIZLI YOL (sol, yeşil) ===== -->
  <rect x="70" y="330" width="500" height="330" rx="12" fill="#0c1a13" stroke="#1e3a2a"/>
  <text x="92" y="358" fill="#3fb950" font-size="13" font-weight="700">HIZLI YOL · canlı fiyat (LLM yok · anında)</text>

  <g>
    <rect x="92" y="372" width="220" height="56" rx="8" fill="#0f2a1e" stroke="#3fb950"/>
    <circle cx="112" cy="392" r="8" fill="#3fb950"/><text x="108" y="396" fill="#04120b" font-size="10" font-weight="700">3</text>
    <text x="128" y="396" fill="#e6edf3" font-size="12" font-weight="700">POST /api/refresh</text>
    <text x="108" y="416" fill="#6e7681" font-size="10">buton + 5dk otomatik</text>
  </g>
  <line x1="202" y1="428" x2="202" y2="456" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <g>
    <rect x="92" y="456" width="450" height="92" rx="8" fill="#0f2a1e" stroke="#3fb950"/>
    <text x="108" y="480" fill="#e6edf3" font-size="13" font-weight="700">live_refresh()  ·  Python</text>
    <text x="108" y="502" fill="#9fe1cb" font-size="11">portfolio.json oku → her varlığı türe göre değerle</text>
    <text x="108" y="520" fill="#9fe1cb" font-size="11">hisse · nakit · emtia · kripto  →  FX ile baz para birimine</text>
    <text x="108" y="538" fill="#6e7681" font-size="10">net-değer + dağılım hesapla</text>
  </g>
  <g>
    <rect x="92" y="572" width="280" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="108" y="596" fill="#e6edf3" font-size="12" font-weight="700">Yahoo Finance</text>
    <text x="108" y="616" fill="#6e7681" font-size="10">fiyat + sembol arama</text>
  </g>
  <line x1="232" y1="548" x2="232" y2="572" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <text x="244" y="566" fill="#6e7681" font-size="10">fiyat çek</text>

  <!-- ===== AI YOL (sağ, amber) ===== -->
  <rect x="610" y="330" width="500" height="330" rx="12" fill="#1a1408" stroke="#3a2e12"/>
  <text x="632" y="358" fill="#d29922" font-size="13" font-weight="700">AI YOL · tam analiz (Claude · token harcar)</text>

  <g>
    <rect x="632" y="372" width="280" height="56" rx="8" fill="#2a210d" stroke="#d29922"/>
    <circle cx="652" cy="392" r="8" fill="#d29922"/><text x="648" y="396" fill="#1a1408" font-size="10" font-weight="700">3</text>
    <text x="668" y="396" fill="#e6edf3" font-size="12" font-weight="700">POST /api/run → sinyal dosyası</text>
    <text x="648" y="416" fill="#6e7681" font-size="10">server Claude'u ÇALIŞTIRMAZ (RCE yok)</text>
  </g>
  <line x1="772" y1="428" x2="772" y2="452" stroke="#d29922" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="632" y="452" width="280" height="50" rx="8" fill="#2a210d" stroke="#d29922"/>
    <circle cx="652" cy="472" r="8" fill="#d29922"/><text x="648" y="476" fill="#1a1408" font-size="10" font-weight="700">4</text>
    <text x="668" y="476" fill="#e6edf3" font-size="12" font-weight="700">Claude watcher (açık session)</text>
    <text x="648" y="494" fill="#6e7681" font-size="10">sinyali görür → workflow çalıştırır</text>
  </g>
  <line x1="772" y1="502" x2="772" y2="526" stroke="#d29922" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="632" y="526" width="280" height="106" rx="8" fill="#2a210d" stroke="#d29922"/>
    <text x="648" y="550" fill="#e6edf3" font-size="12" font-weight="700">finops-full-pipeline (4 faz)</text>
    <text x="648" y="570" fill="#fac775" font-size="10">intake → connector → review → synthesis</text>
    <text x="648" y="588" fill="#fac775" font-size="10">data-retriever + reviewer (subagent)</text>
    <text x="648" y="606" fill="#6e7681" font-size="10">AI risk bulguları (severity'li)</text>
    <text x="648" y="624" fill="#6e7681" font-size="10">+ pipeline-status.json</text>
  </g>
  <!-- skills -->
  <g>
    <rect x="932" y="526" width="160" height="106" rx="8" fill="#241a33" stroke="#8a63d2"/>
    <text x="948" y="548" fill="#c9b8ef" font-size="11" font-weight="700">.claude/skills</text>
    <text x="948" y="568" fill="#8a7bc0" font-size="9">finops-agent</text>
    <text x="948" y="582" fill="#8a7bc0" font-size="9">market-researcher</text>
    <text x="948" y="596" fill="#8a7bc0" font-size="9">valuation-reviewer</text>
    <text x="948" y="610" fill="#8a7bc0" font-size="9">model-builder</text>
    <text x="948" y="624" fill="#8a7bc0" font-size="9">earnings-reviewer</text>
  </g>
  <line x1="912" y1="579" x2="932" y2="579" stroke="#8a63d2" stroke-width="2" marker-end="url(#p)"/>

  <!-- ===== ADIM 5: ortak çıktı ===== -->
  <g>
    <rect x="390" y="694" width="400" height="64" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <circle cx="412" cy="718" r="9" fill="#388bfd"/><text x="408" y="722" fill="#fff" font-size="11" font-weight="700">5</text>
    <text x="430" y="722" fill="#e6edf3" font-size="14" font-weight="700">output/latest.json</text>
    <text x="430" y="742" fill="#6e7681" font-size="10">paylaşılan çıktı · gerçek veri gitignore'lu (sadece *.sample paylaşılır)</text>
  </g>
  <!-- two lanes feed output -->
  <path d="M320 632 V726 H390" stroke="#3fb950" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
  <path d="M772 632 V726 H790" stroke="#d29922" stroke-width="2.5" fill="none" marker-end="url(#a)" transform="translate(0,0)"/>
  <path d="M860 632 V726 H790" stroke="#d29922" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- output back to UI (left margin, clean L route) -->
  <path d="M390 726 H40 V135 H430" stroke="#388bfd" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="48" y="430" fill="#6e7681" font-size="11" transform="rotate(-90 48 430)">UI polling /api/latest → ekranı günceller</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/></marker>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d29922"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#388bfd"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a63d2"/></marker>
  </defs>
</svg>
