<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'JetBrains Mono','SF Mono',monospace">
  <rect width="1200" height="660" fill="#0b0e14"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="700">EFA FinOps — Mimari / Architecture</text>
  <text x="32" y="62" fill="#6e7681" font-size="12">skill + connector + subagent · iki veri yolu: Python canlı-fiyat (LLM yok) ve Claude AI pipeline</text>

  <!-- legend -->
  <g font-size="11">
    <rect x="760" y="30" width="14" height="14" rx="3" fill="#10243f" stroke="#388bfd"/><text x="780" y="42" fill="#8b949e">UI / Server</text>
    <rect x="880" y="30" width="14" height="14" rx="3" fill="#0f2a1e" stroke="#3fb950"/><text x="900" y="42" fill="#8b949e">Python (LLM yok)</text>
    <rect x="1030" y="30" width="14" height="14" rx="3" fill="#2a210d" stroke="#d29922"/><text x="1050" y="42" fill="#8b949e">Claude AI</text>
  </g>

  <!-- UI -->
  <g>
    <rect x="40" y="100" width="240" height="90" rx="8" fill="#10243f" stroke="#388bfd"/>
    <text x="56" y="128" fill="#e6edf3" font-size="14" font-weight="700">Terminal UI</text>
    <text x="56" y="148" fill="#8b949e" font-size="11">index.html · assets/</text>
    <text x="56" y="166" fill="#6e7681" font-size="10">hero · pozisyonlar · dağılım</text>
    <text x="56" y="180" fill="#6e7681" font-size="10">⚙ Portföy Düzenle (form + arama)</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="40" y="250" width="240" height="150" rx="8" fill="#10243f" stroke="#388bfd"/>
    <text x="56" y="278" fill="#e6edf3" font-size="14" font-weight="700">pipeline_server.py</text>
    <text x="56" y="296" fill="#6e7681" font-size="10">stdlib · 127.0.0.1 · sıfır bağımlılık</text>
    <text x="56" y="320" fill="#3fb950" font-size="10">GET  /api/latest · /api/history</text>
    <text x="56" y="336" fill="#3fb950" font-size="10">GET  /api/search · /api/portfolio</text>
    <text x="56" y="352" fill="#3fb950" font-size="10">POST /api/refresh  (canlı fiyat)</text>
    <text x="56" y="368" fill="#3fb950" font-size="10">POST /api/portfolio (kaydet+değerle)</text>
    <text x="56" y="384" fill="#d29922" font-size="10">POST /api/run  (sinyal → watcher)</text>
  </g>
  <line x1="160" y1="190" x2="160" y2="250" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="168" y="225" fill="#6e7681" font-size="10">/api polling</text>

  <!-- Path A: Python live -->
  <g>
    <rect x="360" y="250" width="220" height="150" rx="8" fill="#0f2a1e" stroke="#3fb950"/>
    <text x="376" y="278" fill="#e6edf3" font-size="14" font-weight="700">live_refresh()</text>
    <text x="376" y="296" fill="#6e7681" font-size="10">Python · LLM gerekmez</text>
    <text x="376" y="320" fill="#9fe1cb" font-size="10">• portfolio.json oku</text>
    <text x="376" y="336" fill="#9fe1cb" font-size="10">• tür-bazlı değerleme</text>
    <text x="376" y="352" fill="#9fe1cb" font-size="10">  hisse·nakit·emtia·kripto</text>
    <text x="376" y="368" fill="#9fe1cb" font-size="10">• FX → baz para birimi</text>
    <text x="376" y="384" fill="#9fe1cb" font-size="10">→ output/latest.json</text>
  </g>
  <path d="M280 325 H360" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="290" y="318" fill="#3fb950" font-size="10">refresh</text>

  <!-- Yahoo -->
  <g>
    <rect x="640" y="270" width="180" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="656" y="296" fill="#e6edf3" font-size="12" font-weight="700">Yahoo Finance</text>
    <text x="656" y="314" fill="#6e7681" font-size="10">fiyat + sembol arama</text>
  </g>
  <path d="M580 300 H640" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Path B: Claude pipeline -->
  <g>
    <rect x="360" y="440" width="220" height="180" rx="8" fill="#2a210d" stroke="#d29922"/>
    <text x="376" y="468" fill="#e6edf3" font-size="14" font-weight="700">finops-full-pipeline</text>
    <text x="376" y="486" fill="#6e7681" font-size="10">.claude/workflows/*.js</text>
    <text x="376" y="510" fill="#fac775" font-size="10">1 intake · portfolio.json</text>
    <text x="376" y="526" fill="#fac775" font-size="10">2 connector · data-retriever</text>
    <text x="376" y="542" fill="#fac775" font-size="10">3 review · reviewer (AI)</text>
    <text x="376" y="558" fill="#fac775" font-size="10">4 synthesis → latest.json</text>
    <text x="376" y="582" fill="#6e7681" font-size="10">+ reviewer_findings (severity)</text>
    <text x="376" y="600" fill="#6e7681" font-size="10">+ pipeline-status.json</text>
  </g>
  <path d="M160 400 V470 H360" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ag2)"/>
  <text x="176" y="430" fill="#d29922" font-size="10">/api/run → sinyal</text>

  <!-- Claude watcher -->
  <g>
    <rect x="640" y="470" width="200" height="120" rx="8" fill="#2a210d" stroke="#d29922"/>
    <text x="656" y="498" fill="#e6edf3" font-size="13" font-weight="700">Claude (açık session)</text>
    <text x="656" y="516" fill="#6e7681" font-size="10">watcher / günlük cron</text>
    <text x="656" y="540" fill="#fac775" font-size="10">sinyali görür → workflow</text>
    <text x="656" y="556" fill="#fac775" font-size="10">çalıştırır (WebFetch+AI)</text>
    <text x="656" y="576" fill="#6e7681" font-size="10">server claude'u ÇALIŞTIRMAZ</text>
  </g>
  <path d="M580 530 H640" stroke="#d29922" stroke-width="2" marker-end="url(#ag2)"/>
  <path d="M740 470 V440 H580" stroke="#d29922" stroke-width="2" fill="none" marker-end="url(#ag2)"/>
  <text x="600" y="432" fill="#6e7681" font-size="10">workflow çağırır</text>

  <!-- skills -->
  <g>
    <rect x="900" y="440" width="270" height="180" rx="8" fill="#241a33" stroke="#8a63d2"/>
    <text x="916" y="468" fill="#e6edf3" font-size="13" font-weight="700">.claude/skills (5)</text>
    <text x="916" y="490" fill="#c9b8ef" font-size="10">finops-agent · net-değer</text>
    <text x="916" y="506" fill="#c9b8ef" font-size="10">market-researcher · araştırma</text>
    <text x="916" y="522" fill="#c9b8ef" font-size="10">valuation-reviewer · çarpan</text>
    <text x="916" y="538" fill="#c9b8ef" font-size="10">model-builder · senaryo</text>
    <text x="916" y="554" fill="#c9b8ef" font-size="10">earnings-reviewer · kazanç</text>
    <text x="916" y="578" fill="#6e7681" font-size="10">subagent: data-retriever,</text>
    <text x="916" y="594" fill="#6e7681" font-size="10">reviewer (ortak)</text>
  </g>
  <path d="M840 530 H900" stroke="#8a63d2" stroke-width="2" marker-end="url(#ag3)"/>

  <!-- output -->
  <g>
    <rect x="900" y="270" width="270" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="916" y="298" fill="#e6edf3" font-size="13" font-weight="700">output/</text>
    <text x="916" y="320" fill="#8b949e" font-size="10">latest.json · history.json</text>
    <text x="916" y="336" fill="#8b949e" font-size="10">watchlist.json · *.md raporlar</text>
    <text x="916" y="360" fill="#6e7681" font-size="10">gitignore'lu — sadece *.sample</text>
    <text x="916" y="376" fill="#6e7681" font-size="10">paylaşılır (gizlilik)</text>
  </g>
  <path d="M580 330 C700 330 800 330 900 330" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M580 480 C720 420 800 400 900 360" stroke="#d29922" stroke-width="2" fill="none" marker-end="url(#ag2)"/>
  <path d="M900 320 C600 250 400 250 280 300" stroke="#388bfd" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#agb)"/>
  <text x="470" y="248" fill="#6e7681" font-size="10">UI okur → render</text>

  <defs>
    <marker id="ag"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/></marker>
    <marker id="ag2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d29922"/></marker>
    <marker id="ag3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a63d2"/></marker>
    <marker id="agb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#388bfd"/></marker>
  </defs>
</svg>
